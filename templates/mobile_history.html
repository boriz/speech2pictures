<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Speech2Pictures - History</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
summary {
  list-style: none;
}
summary::-webkit-details-marker {
  display: none;
}
</style>
</head>
<body class="bg-[#101415] text-slate-100 min-h-screen pb-[80px] pt-[64px]">
<header class="fixed top-0 left-0 w-full h-16 flex items-center justify-between px-5 z-50 bg-slate-900/80 backdrop-blur-xl border-b border-white/10">
<details class="relative">
<summary class="text-violet-500 hover:text-violet-300 transition-colors active:scale-95 duration-200 cursor-pointer">
<span class="material-symbols-outlined">menu</span>
</summary>
<div class="absolute left-0 top-10 w-44 rounded-lg border border-white/10 bg-slate-950/95 shadow-xl shadow-black/40 overflow-hidden font-['Manrope'] text-sm">
<a class="block px-4 py-3 text-slate-300 hover:bg-slate-800" href="{{ url_for('auto') }}">Auto</a>
<a class="block px-4 py-3 text-slate-300 hover:bg-slate-800" href="{{ url_for('manual') }}">Manual</a>
<a class="block px-4 py-3 text-violet-300 bg-violet-500/10" href="{{ url_for('history_index') }}">History</a>
</div>
</details>
<div class="font-['Space_Grotesk'] font-bold tracking-tight text-xl text-slate-50">History</div>
<div class="w-6"></div>
</header>
<main class="px-5 py-4 space-y-6 max-w-2xl mx-auto">
{% if Message %}
<div class="rounded-lg border border-slate-700 bg-slate-800 p-3 font-['Manrope'] text-slate-200">
{{ Message }}
</div>
{% endif %}
{% if Selected %}
<div class="space-y-3">
<div class="w-full aspect-square rounded-xl bg-slate-800 border border-slate-700 relative overflow-hidden shadow-lg shadow-black/50">
<img src="data:image/jpeg;base64,{{ Selected.Image }}" class="absolute inset-0 w-full h-full object-cover" alt="Generated Image">
</div>
<div class="rounded-lg border border-slate-700 bg-slate-800 p-3 font-['Manrope'] text-slate-400 text-sm">
Generated {{ Selected.Timestamp }}
</div>
</div>
{% endif %}
{% if Images %}
<div class="grid grid-cols-3 gap-3">
{% for item in Images %}
<a class="block rounded-lg overflow-hidden border {% if Selected and item.ID == Selected.ID %}border-violet-400{% else %}border-slate-700{% endif %} bg-slate-800" href="{{ url_for('history_index', ID=item.ID) }}">
<div class="aspect-square relative">
<img src="data:image/jpeg;base64,{{ item.Image }}" class="absolute inset-0 w-full h-full object-cover" alt="Generated Image">
</div>
<div class="px-2 py-1 font-['Manrope'] text-[10px] leading-tight text-slate-400 truncate">{{ item.Timestamp }}</div>
</a>
{% endfor %}
</div>
{% endif %}
</main>
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-2 pb-2 bg-slate-950/80 backdrop-blur-xl border-t border-white/10 rounded-t-2xl md:hidden">
<a class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 transition-all active:scale-90 duration-150 px-4 py-1 rounded-xl" href="{{ url_for('auto') }}">
<span class="material-symbols-outlined mb-1">bolt</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Auto</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 transition-all active:scale-90 duration-150 px-4 py-1 rounded-xl" href="{{ url_for('manual') }}">
<span class="material-symbols-outlined mb-1">photo_library</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Manual</span>
</a>
<a class="flex flex-col items-center justify-center text-violet-400 bg-violet-500/10 rounded-xl px-4 py-1 active:scale-90 duration-150" href="{{ url_for('history_index') }}">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">History</span>
</a>
</nav>
</body>
</html>
