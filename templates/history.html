<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Speech2Pictures - History</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='mobile_shell.css') }}" rel="stylesheet">
<style>
summary {
  list-style: none;
}
summary::-webkit-details-marker {
  display: none;
}
.metadata-popover {
  position: relative;
  display: inline-flex;
  align-items: center;
}
.metadata-popover-panel {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 80;
  width: min(22rem, calc(100vw - 2.5rem));
  max-width: calc(100vw - 2.5rem);
  max-height: min(18rem, 45vh);
  overflow: auto;
  white-space: pre-wrap;
}
.history-thumbnail {
  scroll-margin-top: 5.5rem;
}
</style>
</head>
<body class="mobile-shell-body bg-[#101415] text-slate-100 min-h-screen pb-[80px] pt-[56px]">
<header class="mobile-shell-topbar">
<details class="relative">
<summary class="text-violet-500 hover:text-violet-300 transition-colors active:scale-95 duration-200 cursor-pointer">
<span class="material-symbols-outlined">menu</span>
</summary>
<div class="absolute left-0 top-10 w-44 rounded-lg border border-white/10 bg-slate-950/95 shadow-xl shadow-black/40 overflow-hidden font-['Manrope'] text-sm">
<a class="block px-4 py-3 text-slate-300 hover:bg-slate-800" href="{{ url_for('auto') }}">Auto</a>
<a class="block px-4 py-3 text-slate-300 hover:bg-slate-800" href="{{ url_for('manual') }}">Manual</a>
<a class="block px-4 py-3 text-violet-300 bg-violet-500/10" href="{{ url_for('history_index') }}">History</a>
<a class="block px-4 py-3 text-slate-300 hover:bg-slate-800 border-t border-white/10" href="{{ url_for('logout') }}">Logout</a>
</div>
</details>
<div class="mobile-shell-topbar-title">History</div>
<a class="mobile-shell-topbar-action" href="{{ url_for('logout') }}" aria-label="Logout">
<span class="material-symbols-outlined text-[18px]">logout</span>
</a>
</header>
<main class="mobile-shell-main max-w-2xl mx-auto">
{% if Message %}
<div class="rounded-lg border border-slate-700 bg-slate-800 p-2 font-['Manrope'] text-slate-200 mb-3">
{{ Message }}
</div>
{% endif %}
{% if Images %}
<div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
{% for item in Images %}
<a
  id="thumb-{{ item.ID }}"
  class="history-thumbnail block rounded-lg overflow-hidden border border-slate-700 bg-slate-800 active:scale-[0.98] transition-transform"
  href="{{ url_for('history_index', ID=item.ID) }}"
  data-history-thumb="1"
  data-image-id="{{ item.ID }}"
  data-image-src="data:image/jpeg;base64,{{ item.Image }}"
  data-image-title="{{ item.Title|default('', true)|e }}"
  data-image-style="{{ item.Style|default('', true)|e }}"
  data-image-description="{{ item.Description|default('', true)|e }}"
  data-image-transcript="{{ item.Transcript|default('', true)|e }}"
  data-image-timestamp="{{ item.Timestamp|default('', true)|e }}"
>
<span class="relative block aspect-square">
<img src="data:image/jpeg;base64,{{ item.Image }}" class="absolute inset-0 w-full h-full object-cover" alt="Generated Image">
</span>
<span class="block px-2 py-1 font-['Manrope'] text-[10px] leading-tight text-slate-400 truncate">{{ item.Timestamp }}</span>
</a>
{% endfor %}
</div>
{% endif %}
</main>
<div id="historyModal" class="fixed inset-0 z-[75] hidden items-center justify-center bg-black/75 p-3">
<div class="w-full max-w-2xl" id="historyModalContent">
<div class="w-full aspect-square rounded-xl bg-slate-800 border border-slate-700 relative overflow-hidden shadow-lg shadow-black/50">
<img id="modalImage" src="" class="absolute inset-0 w-full h-full object-cover" alt="Selected generated image">
</div>
<div class="mt-2 rounded-lg border border-slate-700 bg-slate-800 p-2">
<div class="flex flex-wrap items-center gap-x-2 gap-y-1 font-['Manrope'] text-xs leading-tight text-slate-300" id="modalMetadataRow">
<span id="modalTitleStyle" class="font-['Space_Grotesk'] text-sm font-semibold text-slate-50"></span>
<details id="modalDescriptionDetails" class="metadata-popover hidden">
<summary class="inline-flex items-center gap-1 text-violet-300 cursor-pointer">
<span class="material-symbols-outlined text-[16px]">info</span>
Description
</summary>
<p id="modalDescriptionText" class="metadata-popover-panel rounded-lg border border-white/10 bg-slate-950 p-3 text-sm text-slate-200 shadow-xl shadow-black/50"></p>
</details>
<details id="modalTranscriptDetails" class="metadata-popover hidden">
<summary class="inline-flex items-center gap-1 text-violet-300 cursor-pointer">
<span class="material-symbols-outlined text-[16px]">notes</span>
Transcript
</summary>
<p id="modalTranscriptText" class="metadata-popover-panel rounded-lg border border-white/10 bg-slate-950 p-3 text-sm text-slate-200 shadow-xl shadow-black/50"></p>
</details>
<span id="modalTimestamp" class="text-slate-400"></span>
</div>
</div>
</div>
</div>
<nav class="mobile-shell-nav fixed bottom-0 left-1/2 w-full max-w-2xl -translate-x-1/2 z-50 flex justify-around items-center bg-slate-950/80 backdrop-blur-xl border-t border-white/10 rounded-t-2xl">
<a class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 transition-all active:scale-90 duration-150 px-4 py-1 rounded-xl" href="{{ url_for('auto') }}">
<span class="material-symbols-outlined mb-1">bolt</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Auto</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 hover:bg-slate-800/50 transition-all active:scale-90 duration-150 px-4 py-1 rounded-xl" href="{{ url_for('manual') }}">
<span class="material-symbols-outlined mb-1">photo_library</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">Manual</span>
</a>
<a class="flex flex-col items-center justify-center text-violet-400 bg-violet-500/10 rounded-xl px-4 py-1 active:scale-90 duration-150" href="{{ url_for('history_index') }}">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-['Space_Grotesk'] text-[10px] font-medium uppercase tracking-widest">History</span>
</a>
</nav>
<script>
const historyModal = document.getElementById("historyModal");
const modalContent = document.getElementById("historyModalContent");
const modalImage = document.getElementById("modalImage");
const modalTitleStyle = document.getElementById("modalTitleStyle");
const modalTimestamp = document.getElementById("modalTimestamp");
const modalDescriptionDetails = document.getElementById("modalDescriptionDetails");
const modalDescriptionText = document.getElementById("modalDescriptionText");
const modalTranscriptDetails = document.getElementById("modalTranscriptDetails");
const modalTranscriptText = document.getElementById("modalTranscriptText");
const selectedImageId = {{ SelectedID if SelectedID is not none else "null" }};
let modalScrollAnchorY = null;

function openHistoryModalFromButton(button) {
  if (!button || !historyModal || !modalImage) {
    return;
  }
  modalScrollAnchorY = window.scrollY;

  const title = button.dataset.imageTitle || "";
  const style = button.dataset.imageStyle || "";
  const description = button.dataset.imageDescription || "";
  const transcript = button.dataset.imageTranscript || "";
  const timestamp = button.dataset.imageTimestamp || "";

  modalImage.src = button.dataset.imageSrc || "";
  modalTitleStyle.textContent = `${title}${style ? ` (${style})` : ""}`.trim();
  modalTimestamp.textContent = timestamp ? `[${timestamp}]` : "";

  if (description) {
    modalDescriptionText.textContent = description;
    modalDescriptionDetails.classList.remove("hidden");
  } else {
    modalDescriptionText.textContent = "";
    modalDescriptionDetails.classList.add("hidden");
    modalDescriptionDetails.open = false;
  }

  if (transcript) {
    modalTranscriptText.textContent = transcript;
    modalTranscriptDetails.classList.remove("hidden");
  } else {
    modalTranscriptText.textContent = "";
    modalTranscriptDetails.classList.add("hidden");
    modalTranscriptDetails.open = false;
  }

  historyModal.classList.remove("hidden");
  historyModal.classList.add("flex");
}

function closeHistoryModal() {
  if (!historyModal) {
    return;
  }
  historyModal.classList.add("hidden");
  historyModal.classList.remove("flex");
  modalDescriptionDetails.open = false;
  modalTranscriptDetails.open = false;
  if (modalScrollAnchorY !== null) {
    window.scrollTo(0, modalScrollAnchorY);
    modalScrollAnchorY = null;
  }
}

document.addEventListener("click", (event) => {
  const thumbnailLink = event.target.closest("[data-history-thumb]");
  if (thumbnailLink) {
    event.preventDefault();
    openHistoryModalFromButton(thumbnailLink);
    return;
  }

  const popoverPanel = event.target.closest(".metadata-popover-panel");
  if (popoverPanel) {
    const popover = popoverPanel.closest("details");
    if (popover) {
      popover.open = false;
    }
    return;
  }

  if (!historyModal || historyModal.classList.contains("hidden")) {
    return;
  }

  const clickedInsideModal = modalContent && modalContent.contains(event.target);
  if (!clickedInsideModal) {
    closeHistoryModal();
  }
});

historyModal.addEventListener("click", (event) => {
  if (event.target === historyModal) {
    closeHistoryModal();
  }
});

modalImage.addEventListener("click", () => {
  closeHistoryModal();
});

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeHistoryModal();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  if (selectedImageId === null) {
    return;
  }
  const selectedButton = document.querySelector(
    `[data-image-id="${selectedImageId}"]`
  );
  if (selectedButton) {
    selectedButton.scrollIntoView({
      block: "center",
      inline: "nearest",
    });
    openHistoryModalFromButton(selectedButton);
  }
});
</script>
</body>
</html>
