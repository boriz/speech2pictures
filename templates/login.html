<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Speech2Pictures - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Manrope:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='mobile_shell.css') }}" rel="stylesheet">
</head>
<body class="mobile-shell-body bg-[#101415] text-slate-100 min-h-screen">
<main class="mx-auto flex min-h-screen w-full max-w-2xl items-center justify-center px-4 py-6">
<section class="w-full max-w-sm rounded-xl border border-slate-700 bg-slate-900/90 p-4 shadow-xl shadow-black/40 space-y-4">
<div class="space-y-1">
<h1 class="font-['Space_Grotesk'] text-xl font-semibold text-slate-50">Speech2Pictures</h1>
<p class="font-['Manrope'] text-sm text-slate-300">Enter password to continue.</p>
</div>
{% if Message %}
<div class="rounded-lg border border-red-400/40 bg-red-900/30 p-2 font-['Manrope'] text-sm text-red-100">{{ Message }}</div>
{% endif %}
<form action="{{ url_for('login') }}" class="space-y-3" method="post">
<input type="hidden" name="next" value="{{ NextPath }}">
<div class="space-y-1.5">
<label class="block font-['Manrope'] text-sm font-semibold text-slate-200" for="password">Password</label>
<input
  id="password"
  name="password"
  type="password"
  autocomplete="current-password"
  required
  class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 font-['Manrope'] text-sm text-slate-100 focus:border-violet-400 focus:ring-violet-400"
>
</div>
<button
  type="submit"
  class="flex w-full items-center justify-center gap-2 rounded-lg bg-violet-600 px-3 py-2.5 font-['Manrope'] text-sm font-semibold text-white active:scale-[0.98]"
>
<span class="material-symbols-outlined text-[18px]">lock_open</span>
Sign In
</button>
</form>
</section>
</main>
</body>
</html>
